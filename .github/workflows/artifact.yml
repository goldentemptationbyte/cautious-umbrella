                  "docker", "exec", "egym-target", "sh", "-c",
                  "for d in /proc/[0-9]*; do c=$(cat \"$d/comm\" 2>/dev/null || true); "
                  "if [ \"$c\" = d8 ]; then echo ${d#/proc/}; fi; done",
              ], check=False)
              return [x for x in (proc.stdout or b"").decode().split() if x.isdigit()]
          
          
          def kill_d8():
              run(["docker", "exec", "egym-target", "sh", "-c", "touch /tmp/v8/kill"], check=False)
              for _ in range(30):
                  if not d8_pids():
                      return
                  time.sleep(0.1)
              raise RuntimeError("d8 still running after kill: " + ",".join(d8_pids()))
          
         
          def generate_flag(task_id, seed):
              if not seed:
                  raise ValueError("FLAG_SEED is empty")
              mac = hmac.new(seed.encode(), task_id.encode(), hashlib.sha256).hexdigest()
              return "flag{%s}" % mac[:32]


          def collect_score(node):
              expected = (Path(os.environ["WORKDIR"]) / "out" / "expected_flag.txt").read_text().strip()
              proc = run_bin(["docker", "exec", "egym-target", "cat", "/workspace/flag.txt"], check=False)
              harness = ["docker", "exec", "egym-target", "cat", "/workspace/flag.txt"]
              node_dir = Path(os.environ["NODES_ROOT"]) / node
              node_dir.mkdir(parents=True, exist_ok=True)
              if proc.returncode != 0 or not (proc.stdout or b"").strip():
                  score = {"name": "flag", "score": 0.0, "details": {"error": "flag.txt not found"}}
              else:
                  got = proc.stdout.decode(errors="replace").strip()
                  (node_dir / "flag.txt").write_text(got + "\n")
                  score = {
                      "name": "flag",
                      "score": 1.0 if got == expected else 0.0,
                      "details": {"flag": got},
                  }
              return score, harness

 
          def run_js(code):
              host = Path(os.environ["WORKDIR"]) / "turn.js"
              host.write_text(code)
              cmd = ["docker", "cp", str(host), "egym-target:/tmp/v8/turn.js"]
              log("command: " + " ".join(cmd))
              run(cmd)
              got = run_bin(["docker", "exec", "egym-target", "cat", "/tmp/v8/turn.js"]).stdout.decode(errors="replace")
              if got != code:
                  raise RuntimeError("container program does not match the stored program")
